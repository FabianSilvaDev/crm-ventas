<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspector de sprites · AI Operations CMS</title>
    <style>
      :root {
        --bg: #0a0e13;
        --panel: #16202b;
        --line: #2b3d4d;
        --ink: #e8f2f8;
        --dim: #7a8fa3;
        --accent: #4fd6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      h1 { font-family: Consolas, monospace; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
      p { color: var(--dim); font-size: 13px; max-width: 80ch; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
      input[type='file'] { color: var(--dim); font-size: 12px; }
      label { font-family: Consolas, monospace; font-size: 11px; text-transform: uppercase; color: var(--dim); }
      canvas { image-rendering: pixelated; background: #070a0e; border: 2px solid var(--line); max-width: 100%; }
      .readout {
        font-family: Consolas, monospace;
        font-size: 13px;
        padding: 8px 10px;
        background: var(--panel);
        border: 2px solid var(--line);
        display: inline-block;
      }
      .readout strong { color: var(--accent); }
      .wrap { overflow: auto; max-height: 70vh; }
    </style>
  </head>
  <body>
    <h1>Inspector de sprites</h1>
    <p>
      Elige una hoja de sprites (por ejemplo la que descargas del generador de LPC). Se dibuja
      con una rejilla de 64x64 y el numero de fila y columna. Pasa el raton para saber que
      celda es y escribe esos valores como <code>row</code> y <code>frame</code> en
      <code>manifest.json</code>.
    </p>

    <div class="bar">
      <input id="file" type="file" accept="image/png,image/*" />
      <label>Zoom
        <select id="zoom">
          <option value="2">2x</option>
          <option value="3" selected>3x</option>
          <option value="4">4x</option>
          <option value="6">6x</option>
        </select>
      </label>
      <label>Tamaño de celda
        <select id="cell">
          <option value="64" selected>64 (LPC)</option>
          <option value="32">32</option>
          <option value="48">48</option>
        </select>
      </label>
      <span class="readout" id="readout">Sin fichero</span>
    </div>

    <div class="wrap"><canvas id="sheet"></canvas></div>

    <script>
      const input = document.getElementById('file');
      const zoomSelect = document.getElementById('zoom');
      const cellSelect = document.getElementById('cell');
      const readout = document.getElementById('readout');
      const canvas = document.getElementById('sheet');
      const context = canvas.getContext('2d');

      let image = null;
      let pointer = { x: -1, y: -1 };

      const cellSize = () => Number(cellSelect.value);
      const zoom = () => Number(zoomSelect.value);

      const draw = () => {
        if (!image) return;

        const cell = cellSize();
        const scale = zoom();
        const columns = Math.ceil(image.width / cell);
        const rows = Math.ceil(image.height / cell);

        canvas.width = columns * cell * scale;
        canvas.height = rows * cell * scale;
        context.imageSmoothingEnabled = false;

        context.fillStyle = '#070a0e';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        // Rejilla: una celda por frame.
        context.strokeStyle = 'rgba(79, 214, 255, 0.35)';
        context.lineWidth = 1;
        for (let column = 0; column <= columns; column += 1) {
          context.beginPath();
          context.moveTo(column * cell * scale + 0.5, 0);
          context.lineTo(column * cell * scale + 0.5, canvas.height);
          context.stroke();
        }
        for (let row = 0; row <= rows; row += 1) {
          context.beginPath();
          context.moveTo(0, row * cell * scale + 0.5);
          context.lineTo(canvas.width, row * cell * scale + 0.5);
          context.stroke();
        }

        // Etiquetas de fila y columna.
        context.font = '11px Consolas, monospace';
        context.fillStyle = '#4fd6ff';
        for (let row = 0; row < rows; row += 1) {
          context.fillText(`r${row}`, 3, row * cell * scale + 12);
        }
        for (let column = 0; column < columns; column += 1) {
          context.fillText(`c${column}`, column * cell * scale + 3, canvas.height - 4);
        }

        if (pointer.x >= 0) {
          context.strokeStyle = '#ffc44d';
          context.lineWidth = 3;
          context.strokeRect(
            Math.floor(pointer.x / cell) * cell * scale,
            Math.floor(pointer.y / cell) * cell * scale,
            cell * scale,
            cell * scale,
          );
        }

        readout.innerHTML = image
          ? `${image.width}x${image.height} px · ${columns} columnas x ${rows} filas`
          : 'Sin fichero';
      };

      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          const loaded = new Image();
          loaded.onload = () => {
            image = loaded;
            canvas.style.display = 'block';
            draw();
          };
          loaded.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      canvas.addEventListener('mousemove', (event) => {
        const bounds = canvas.getBoundingClientRect();
        const scale = zoom();
        pointer = {
          x: ((event.clientX - bounds.left) * (canvas.width / bounds.width)) / scale,
          y: ((event.clientY - bounds.top) * (canvas.height / bounds.height)) / scale,
        };
        draw();

        const cell = cellSize();
        const row = Math.floor(pointer.y / cell);
        const frame = Math.floor(pointer.x / cell);
        readout.innerHTML = `celda <strong>row: ${row}</strong> · <strong>frame: ${frame}</strong> (${cell}x${cell} px)`;
      });

      canvas.addEventListener('mouseleave', () => {
        pointer = { x: -1, y: -1 };
        draw();
        if (image) readout.textContent = 'Pasa el raton por una celda';
      });

      zoomSelect.addEventListener('change', draw);
      cellSelect.addEventListener('change', draw);
    </script>
  </body>
</html>
